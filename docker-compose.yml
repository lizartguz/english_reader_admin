# Despliegue del panel administrativo.
#
# Solo levanta el frontend: `english_reader_api` tiene su propio compose. Ambos
# deben compartir red (o resolverse por URL pública) para que el navegador
# alcance la API en `API_BASE_URL`.
services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: english-reader-admin:latest
    container_name: english_reader_admin
    restart: unless-stopped
    ports:
      # 8080 dentro del contenedor: la imagen corre sin privilegios de root.
      - '${ADMIN_PORT:-8080}:8080'
    environment:
      # URL que consumirá el navegador del usuario, no la red interna de Docker.
      API_BASE_URL: ${API_BASE_URL:?Define la URL pública de english_reader_api}
      APP_ENV: ${APP_ENV:-production}
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
