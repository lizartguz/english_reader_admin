server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No se anuncia la versión del servidor.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad. El panel no debe poder incrustarse en otro sitio.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Los assets llevan hash en el nombre, así que se pueden cachear sin límite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # La configuración de ambiente cambia entre despliegues de la misma imagen:
    # nunca debe quedar cacheada.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # El index tampoco se cachea: es quien apunta a los assets nuevos.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # SPA: cualquier ruta desconocida la resuelve React Router, no nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
